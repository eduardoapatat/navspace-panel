; NavSpace uploads building models in .glb format together with their images,
; which are far larger than the PHP defaults allow.
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 512M
max_execution_time = 120

; An explicit temporary directory prevents the "failed to upload" error that
; appears when PHP has no writable location to stage the incoming file.
upload_tmp_dir = /tmp

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
