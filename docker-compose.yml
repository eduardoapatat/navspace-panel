services:
    app:
        build:
            context: .
        image: navspace-panel
        container_name: navspace-panel
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:80'
        # Settings the operator is expected to change, including the SMTP
        # credentials. Copy .env.docker.example to .env.docker and edit it there;
        # the panel still starts with sane defaults when the file is absent.
        env_file:
            - path: .env.docker
              required: false
        # Fixed values: they map to the volumes below, so they are not meant to
        # be overridden from .env.docker.
        environment:
            DB_CONNECTION: sqlite
            DB_DATABASE: /app/database-data/database.sqlite
        volumes:
            # Keeps the SQLite database between restarts.
            - navspace-database:/app/database-data
            # Keeps the uploaded building models and images.
            - navspace-storage:/app/storage/app/public
        # Caps so a runaway container cannot exhaust the host.
        mem_limit: 1g
        cpus: 2
        pids_limit: 256
        # Without a cap, container logs grow until they fill the server disk.
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'
        # Reuses the endpoint the Unity app already polls to check the API.
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost/api/health']
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 3

    # Catches the outgoing mail so password resets and email verification can be
    # tested without a real SMTP account. Replace it in production.
    mailpit:
        image: axllent/mailpit:latest
        container_name: navspace-mailpit
        restart: unless-stopped
        ports:
            - '${MAILPIT_PORT:-8025}:8025'
        mem_limit: 256m
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

volumes:
    navspace-database:
    navspace-storage:
