services:
    app:
        build:
            context: .
        image: navspace-panel
        container_name: navspace-panel
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:80'
        # Every setting comes from .env, copied from .env.example. Compose fails
        # when it is missing, so the panel never starts half configured.
        env_file:
            - .env
        # Fixed values: they map to the volumes below and are not meant to change.
        environment:
            DB_CONNECTION: sqlite
            DB_DATABASE: /app/database-data/database.sqlite
        volumes:
            # Keeps the SQLite database between restarts.
            - navspace-database:/app/database-data
            # Keeps the uploaded building models and images.
            - navspace-storage:/app/storage/app/public
        # Caps so a runaway container cannot exhaust the host.
        mem_limit: 1g
        cpus: 2
        pids_limit: 256
        # Without a cap, container logs grow until they fill the server disk.
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'
        # Reuses the endpoint the Unity app already polls to check the API.
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost/api/health']
            interval: 30s
            timeout: 5s
            start_period: 60s
            retries: 3

volumes:
    navspace-database:
    navspace-storage:
